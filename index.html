<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Form</h1>

        <p class="subtitle">
            Fill in the details and click Submit
        </p>

        <form id="contactForm">

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="userMessage">Message</label>

                <textarea
                    id="userMessage"
                    name="message"
                    placeholder="Enter your message"
                    required
                ></textarea>
            </div>


            <button type="submit" id="submitBtn">
                Submit
            </button>

        </form>


        <div id="status"></div>

    </div>


    <script>

        // ==========================================
        // GOOGLE APPS SCRIPT WEB APP
        // ==========================================

        const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyohP7_BrExXyxlhm952mdTUQbVmWRuLa3LNO-xqYVqU-NuU26zTa-PWflrUpgSl8DM/exec";


        // ==========================================
        // FORM
        // ==========================================

        const form =
            document.getElementById("contactForm");

        const submitBtn =
            document.getElementById("submitBtn");

        const status =
            document.getElementById("status");


        // ==========================================
        // SUBMIT
        // ==========================================

        form.addEventListener("submit", async function(e) {

            e.preventDefault();


            // Get values
            const name =
                document.getElementById("name").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const message =
                document.getElementById("userMessage").value.trim();


            // Check fields
            if (!name || !phone || !email || !message) {

                status.className = "error";

                status.innerText =
                    "❌ Please fill all fields.";

                return;
            }


            // Loading
            submitBtn.disabled = true;

            submitBtn.innerText = "Submitting...";

            status.className = "";

            status.innerText = "";


            // Data
            const data = {

                name: name,

                phone: phone,

                email: email,

                message: message

            };


            try {

                const response = await fetch(
                    GOOGLE_SCRIPT_URL,
                    {
                        method: "POST",

                        body: JSON.stringify(data)
                    }
                );


                const result = await response.json();


                if (result.status === "success") {

                    status.className = "success";

                    status.innerText =
                        "✅ Submitted successfully!";

                    form.reset();

                } else {

                    status.className = "error";

                    status.innerText =
                        "❌ Failed to save data.";

                }

            } catch (error) {

                console.error(error);

                status.className = "error";

                status.innerText =
                    "❌ Something went wrong. Please try again.";

            }


            // Reset button
            submitBtn.disabled = false;

            submitBtn.innerText = "Submit";

        });

    </script>

</body>
</html>
