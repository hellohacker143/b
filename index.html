<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Google Sheet Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Contact Form</h2>

    <form id="contactForm">

        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Phone</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >

        <label>Message</label>
        <textarea
            id="userMessage"
            placeholder="Enter your message"
            required
        ></textarea>

        <button type="submit" id="submitBtn">
            Submit
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

    // =========================================
    // PUT YOUR GOOGLE APPS SCRIPT URL HERE
    // =========================================

    const GOOGLE_SCRIPT_URL =
        "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";


    // =========================================
    // FORM SUBMIT
    // =========================================

    document
        .getElementById("contactForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const submitBtn =
                document.getElementById("submitBtn");

            const message =
                document.getElementById("message");


            // Get form values
            const name =
                document.getElementById("name").value;

            const phone =
                document.getElementById("phone").value;

            const email =
                document.getElementById("email").value;

            const userMessage =
                document.getElementById("userMessage").value;


            // Data to Google Sheet
            const formData = {

                name: name,

                phone: phone,

                email: email,

                message: userMessage

            };


            // Button loading
            submitBtn.disabled = true;

            submitBtn.innerText = "Submitting...";

            message.innerHTML = "";


            // Send data
            fetch(GOOGLE_SCRIPT_URL, {

                method: "POST",

                body: JSON.stringify(formData)

            })

            .then(response => response.json())

            .then(data => {

                if (data.status === "success") {

                    message.className = "success";

                    message.innerText =
                        "✅ Form submitted successfully!";

                    document
                        .getElementById("contactForm")
                        .reset();

                } else {

                    message.className = "error";

                    message.innerText =
                        "❌ Something went wrong.";

                }

            })

            .catch(error => {

                console.error(error);

                message.className = "error";

                message.innerText =
                    "❌ Unable to submit form.";

            })

            .finally(() => {

                submitBtn.disabled = false;

                submitBtn.innerText = "Submit";

            });

        });

</script>

</body>
</html>
