<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DMart Daily</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#222}
header{position:sticky;top:0;z-index:20;background:#fff;height:68px;display:flex;align-items:center;padding:0 5%;gap:20px;box-shadow:0 2px 15px #0001}
.logo{font-size:21px;font-weight:800;color:#087f3f}.logo span{font-size:28px}.loc-btn{margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.cart{background:#087f3f;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}
.hero{max-width:1200px;margin:20px auto;padding:45px;border-radius:24px;background:linear-gradient(100deg,#e9f8ef,#fff);animation:fadeUp .7s ease}.hero h1{font-size:42px;margin:10px 0}.hero strong{color:#087f3f}.hero p{color:#666}.shop{display:inline-block;background:#087f3f;color:white;padding:13px 22px;border-radius:10px;text-decoration:none}
.toolbar{max-width:1200px;margin:20px auto;display:flex;gap:10px}.toolbar input,.toolbar select{padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff}.toolbar input{flex:1}
.products{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:80px}
.product{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #eee;animation:fadeUp .5s ease;transition:.25s}.product:hover{transform:translateY(-7px);box-shadow:0 12px 28px #0002}.product img{width:100%;height:180px;object-fit:cover}.body{padding:14px}.body h3{font-size:15px;min-height:38px}.price{font-weight:800;color:#087f3f}.add{width:100%;padding:10px;margin-top:10px;border:1px solid #087f3f;background:#fff;color:#087f3f;border-radius:9px;font-weight:bold;cursor:pointer}.add:hover{background:#087f3f;color:#fff}
.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:30}.overlay.show{display:block}.drawer{position:fixed;right:-430px;top:0;width:420px;max-width:100%;height:100vh;background:#fff;z-index:40;padding:20px;transition:.35s;overflow:auto}.drawer.show{right:0}
.carthead{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}.item{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.item img{width:62px;height:62px;object-fit:cover;border-radius:8px}.info{flex:1}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}.bill{border-top:1px solid #ddd;margin-top:18px;padding-top:12px}.line{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:19px;font-weight:bold;border-top:1px solid #ddd;padding-top:10px}.order{width:100%;padding:14px;border:0;background:#087f3f;color:#fff;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:450px;max-width:100%;background:#fff;border-radius:18px;padding:24px;position:relative;animation:pop .25s ease}.box input,.box textarea,.box select{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px}.box textarea{height:90px}.detect{width:100%;padding:12px;border:1px dashed #087f3f;background:#effaf3;color:#087f3f;border-radius:9px;font-weight:bold;cursor:pointer}.status{margin-top:10px;font-size:13px;color:#666}.mapbox{display:none;margin-top:12px;height:190px;border-radius:12px;overflow:hidden;position:relative;background:#dceee2}.mapbox.show{display:block}.mapbox iframe{width:100%;height:100%;border:0}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:35px;animation:bounce 1.1s infinite}.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;box-shadow:0 2px 8px #0003}.zoom button{width:38px;height:38px;border:0;background:#fff;font-size:22px;cursor:pointer}.float{position:fixed;right:22px;bottom:22px;width:60px;height:60px;background:#25d366;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:28px;z-index:25;animation:pulse 2s infinite}
footer{text-align:center;background:#222;color:#aaa;padding:25px;font-size:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes bounce{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-125%)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #25d36655}50%{box-shadow:0 0 0 12px #25d36600}}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr);padding:0 15px 70px}.hero{margin:15px}}
@media(max-width:650px){header{padding:0 12px}.loc-btn{font-size:12px}.hero{margin:0;border-radius:0;padding:32px 20px}.hero h1{font-size:32px}.toolbar{margin:15px 12px;display:grid}.products{grid-template-columns:repeat(2,1fr);gap:12px}.product img{height:145px}.drawer{width:100%}}
@media(max-width:380px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="logo">🛒 DMart Daily</div>
  <button class="loc-btn" onclick="detectLocation()">📍 <span id="locText">Allow Location</span></button>
  <button class="cart" onclick="openCart()">🛒 Cart <span id="count">0</span></button>
</header>

<section class="hero">
  <div>
    <small style="color:#087f3f;font-weight:bold;letter-spacing:2px">DAILY ESSENTIALS</small>
    <h1>Fresh groceries at <strong>great prices.</strong></h1>
    <p>Allow location to use your current location for delivery.</p>
    <a class="shop" href="#products">Shop Now ↓</a>
  </div>
</section>

<div class="toolbar">
  <input id="search" placeholder="🔍 Search products..." oninput="render()">
  <select id="category" onchange="render()">
    <option value="all">All Categories</option><option>Groceries</option><option>Dairy</option>
    <option>Beverages</option><option>Snacks</option><option>Household</option><option>Personal Care</option>
  </select>
</div>

<main class="products" id="products"></main>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="carthead"><h2>Your Cart</h2><button class="close" onclick="closeCart()">✕</button></div>
  <div id="items"></div><div class="bill" id="bill"></div>
  <button class="order" onclick="checkout()">📲 Place Order</button>
</aside>

<div class="modal" id="modal">
 <div class="box">
   <button class="close" style="position:absolute;right:15px;top:15px" onclick="closeCheckout()">✕</button>
   <h2>Delivery Details</h2>
   <input id="name" placeholder="Customer Name">
   <input id="phone" placeholder="Mobile Number">
   <button class="detect" onclick="detectLocation(true)">📍 Use My Current Location</button>
   <div class="status" id="status">Location not selected</div>
   <div class="mapbox" id="mapbox">
     <iframe id="map" loading="lazy"></iframe>
     <div class="pin">📍</div>
     <div class="zoom"><button onclick="zoomMap(1)">+</button><button onclick="zoomMap(-1)">−</button></div>
   </div>
   <textarea id="address" placeholder="Delivery Address"></textarea>
   <select id="payment"><option>Cash on Delivery</option><option>UPI</option></select>
   <div class="bill" id="checkoutBill"></div>
   <button class="order" onclick="sendWhatsApp()">📲 Send Order on WhatsApp</button>
 </div>
</div>

<a class="float" href="https://wa.me/917660856536" target="_blank">☎</a>
<footer>© 2026 DMart Daily • Demo Grocery Store</footer>

<script>
const products=[
["Aashirvaad Atta 5 kg","Groceries",285,"https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80"],
["India Gate Basmati Rice 5 kg","Groceries",499,"https://images.unsplash.com/photo-1536304993881-ff6e9e5e4c8a?auto=format&fit=crop&w=800&q=80"],
["Toor Dal 1 kg","Groceries",165,"https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=800&q=80"],
["Fortune Sunflower Oil 1 L","Groceries",125,"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=800&q=80"],
["Amul Taaza Milk 1 L","Dairy",68,"https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=800&q=80"],
["Amul Butter 500 g","Dairy",275,"https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?auto=format&fit=crop&w=800&q=80"],
["Milkmaid 380 g","Dairy",145,"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?auto=format&fit=crop&w=800&q=80"],
["Tata Tea 500 g","Beverages",245,"https://images.unsplash.com/photo-1594631252845-29fc4cc8cde9?auto=format&fit=crop&w=800&q=80"],
["Nescafe Classic 100 g","Beverages",295,"https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80"],
["Coca-Cola 750 ml","Beverages",45,"https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=800&q=80"],
["Lay's Magic Masala","Snacks",20,"https://images.unsplash.com/photo-1621939514649-280e2aa12c2b?auto=format&fit=crop&w=800&q=80"],
["Kurkure Masala Munch","Snacks",20,"https://images.unsplash.com/photo-1621447504864-d8686e12698c?auto=format&fit=crop&w=800&q=80"],
["Oreo Original 120 g","Snacks",35,"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=800&q=80"],
["Surf Excel Matic 2 kg","Household",325,"https://images.unsplash.com/photo-1585832770485-e68a5dbfad52?auto=format&fit=crop&w=800&q=80"],
["Vim Dishwash Liquid 750 ml","Household",115,"https://images.unsplash.com/photo-1583947215259-38e31be8751f?auto=format&fit=crop&w=800&q=80"],
["Harpic Toilet Cleaner 1 L","Household",165,"https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=800&q=80"],
["Dove Bath Soap 3 Pack","Personal Care",145,"https://images.unsplash.com/photo-1607006344380-b6775a0824b7?auto=format&fit=crop&w=800&q=80"],
["Colgate MaxFresh 150 g","Personal Care",105,"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?auto=format&fit=crop&w=800&q=80"],
["Head & Shoulders Shampoo","Personal Care",399,"https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=80"],
["Parle-G Biscuits 800 g","Snacks",80,"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=800&q=80"]
].map((p,i)=>({id:i+1,name:p[0],cat:p[1],price:p[2],img:p[3]}));

let cart=JSON.parse(localStorage.getItem("dmartCart")||"{}");
let mapZoom=14;

function money(n){return "₹"+n.toLocaleString("en-IN")}
function render(){
 const q=document.getElementById("search").value.toLowerCase(), c=document.getElementById("category").value;
 document.getElementById("products").innerHTML=products.filter(p=>(c=="all"||p.cat==c)&&p.name.toLowerCase().includes(q)).map(p=>`
 <article class="product"><img src="${p.img}" alt="${p.name}" loading="lazy"><div class="body">
 <small style="color:#888">${p.cat}</small><h3>${p.name}</h3><div class="price">${money(p.price)}</div>
 <button class="add" onclick="add(${p.id})">+ Add to Cart</button></div></article>`).join("");
}
function add(id){cart[id]=(cart[id]||0)+1;save();openCart()}
function save(){localStorage.setItem("dmartCart",JSON.stringify(cart));document.getElementById("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function totals(){let s=0;Object.entries(cart).forEach(([id,q])=>s+=products.find(p=>p.id==id).price*q);let d=s&&s<499?40:0,disc=s>=999?Math.round(s*.05):0,tax=Math.round((s-disc)*.05);return{s,d,disc,tax,total:s+d-disc+tax}}
function openCart(){document.getElementById("drawer").classList.add("show");document.getElementById("overlay").classList.add("show");displayCart()}
function closeCart(){document.getElementById("drawer").classList.remove("show");document.getElementById("overlay").classList.remove("show")}
function displayCart(){
 const entries=Object.entries(cart), el=document.getElementById("items");
 el.innerHTML=entries.length?entries.map(([id,q])=>{let p=products.find(x=>x.id==id);return `<div class="item"><img src="${p.img}"><div class="info"><b>${p.name}</b><br>${money(p.price)}<div class="qty"><button onclick="qty(${id},-1)">−</button><b>${q}</b><button onclick="qty(${id},1)">+</button></div></div></div>`}).join(""):"<p style='text-align:center;padding:40px;color:#777'>Your cart is empty.</p>";
let t=totals();document.getElementById("bill").innerHTML=`<div class="line"><span>Item Total</span><b>${money(t.s)}</b></div><div class="line"><span>Delivery</span><b>${t.d?money(t.d):"FREE"}</b></div><div class="line"><span>Discount</span><b>- ${money(t.disc)}</b></div><div class="line"><span>GST / Tax</span><b>${money(t.tax)}</b></div><div class="line total"><span>Total Bill</span><b>${money(t.total)}</b></div>`;
}
function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();displayCart()}
function checkout(){if(!Object.keys(cart).length)return alert("Add products first.");closeCart();let t=totals();document.getElementById("checkoutBill").innerHTML=`<div class="line"><span>Total Bill</span><b>${money(t.total)}</b></div>`;document.getElementById("modal").classList.add("show")}
function closeCheckout(){document.getElementById("modal").classList.remove("show")}

/* LOCATION */
function detectLocation(fromCheckout=false){
 if(!navigator.geolocation){
   alert("Location is not supported by this browser.");return;
 }
 const status=document.getElementById("status");
 if(fromCheckout)status.textContent="Requesting your location...";
 else document.getElementById("locText").textContent="Getting location...";
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude,lon=pos.coords.longitude;
   if(!fromCheckout){
     document.getElementById("locText").textContent="Location Added ✓";
     document.getElementById("locText").style.color="#087f3f";
   }
   if(fromCheckout){
     status.textContent=`Current location detected: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
     document.getElementById("address").value=`Current GPS Location: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
     document.getElementById("mapbox").classList.add("show");
     updateMap(lat,lon);
   }
 },err=>{
   if(fromCheckout)status.textContent="Location permission was denied. You can enter address manually.";
   else document.getElementById("locText").textContent="Allow Location";
   alert("Please allow location permission in your browser to detect your location.");
 },{enableHighAccuracy:true,timeout:10000});
}
function updateMap(lat,lon){
 document.getElementById("map").src=`https://www.openstreetmap.org/export/embed.html?bbox=${lon-.02/mapZoom*14}%2C${lat-.015/mapZoom*14}%2C${lon+.02/mapZoom*14}%2C${lat+.015/mapZoom*14}&layer=mapnik&marker=${lat}%2C${lon}`;
}
function zoomMap(direction){mapZoom=Math.max(5,Math.min(19,mapZoom+direction));const text=document.getElementById("status").textContent.match(/(-?\\d+\\.\\d+)/g);if(text&&text.length>=2)updateMap(parseFloat(text[0]),parseFloat(text[1]))}

function sendWhatsApp(){
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),payment=document.getElementById("payment").value;
 if(!name||!phone||!address)return alert("Please enter customer name, mobile and delivery address.");
 let t=totals(),items="";
 Object.entries(cart).forEach(([id,q])=>{let p=products.find(x=>x.id==id);items+=`• ${p.name} x ${q} = ${money(p.price*q)}\n`});
 const msg=`*NEW DMART DAILY ORDER*\\n\\nCustomer: ${name}\\nMobile: ${phone}\\nAddress: ${address}\\nPayment: ${payment}\\n\\n*ITEMS*\\n${items}\\n*BILL*\\nItem Total: ${money(t.s)}\\nDelivery: ${t.d?money(t.d):"FREE"}\\nDiscount: -${money(t.disc)}\\nGST/Tax: ${money(t.tax)}\\n*TOTAL BILL: ${money(t.total)}*`;
 window.open("https://wa.me/917660856536?text="+encodeURIComponent(msg),"_blank");
}
render();save();
</script>
</body>
</html>
